name: Release platform packages

# 发布工作流放在公开仓库：公开仓库的 GitHub 托管标准跑器免费、不计额度
# （私有仓 macOS 10 倍率/Windows 2 倍率曾把 2000 分钟/月烧光）。
#
# 公开日志红线：本工作流不得让 core 源码行进入日志——
# 不跑 pytest（失败 traceback 会打印源码上下文），不上传 artifacts，
# 门禁只跑纯元数据检查（--gates-only）。完整测试门禁由发布前的本机
# release_preflight.py（全量 pytest + 视觉样张）强制执行，见 core docs/release-runbook.md。
#
# core 源码只在运行时通过只读 Deploy Key checkout 到临时跑器，任务结束即销毁，
# 不进入本仓库 git 历史。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish npm packages after successful builds"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 供应链安全：最小权限 + 所有第三方 action 固定完整 commit SHA
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            binary: dist/report-kit
            package-dir: npm/platform-packages/darwin-arm64
          - platform: linux-x64
            os: ubuntu-latest
            binary: dist/report-kit
            package-dir: npm/platform-packages/linux-x64
          - platform: windows-x64
            os: windows-2025-vs2026
            binary: dist/report-kit.exe
            package-dir: npm/platform-packages/windows-x64

    steps:
      # 私有 core 只读 checkout（Deploy Key 权限面：仅 core 单仓、read-only）
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/reportkit-cli-core
          ssh-key: ${{ secrets.CORE_CHECKOUT_SSH_KEY }}

      # 公开仓库自身：版本锁步与 skill 漂移门禁的对照物
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: build/public-repo

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller==6.20.0

      # 跑器无中文字体：下载固定版本楷体/宋体（sha256 校验）供冒烟构建使用
      - name: Fetch pinned CJK fonts
        run: python scripts/fetch_ci_fonts.py

      - name: Fetch Typst runtime
        run: python scripts/fetch_typst_runtime.py --platform "${{ matrix.platform }}"

      # 纯元数据门禁：版本锁步 / skill 漂移 / 包边界（日志只含版本号与文件清单）
      - name: Release metadata gates
        if: matrix.platform == 'linux-x64'
        run: python scripts/release_preflight.py --gates-only --public-repo build/public-repo --skip-npm-auth

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Check binary version
        shell: bash
        run: '"${{ matrix.binary }}" --version'

      - name: Smoke test PDF build
        shell: bash
        run: |
          mkdir -p build/ci-smoke
          cat > build/ci-smoke/content.md <<'EOF'
          ---
          title: ReportKit CI Smoke Test
          subtitle: Platform binary verification
          author: ReportKit
          date: 2026-07-11
          ---

          # Executive Summary

          This smoke test verifies that the platform binary can export prepared Markdown into PDF. The build matrix is shown in 表 1.1.

          表 1.1：Build Matrix
          | Platform | Status | Output |
          | --- | --- | --- |
          | ${{ matrix.platform }} | ready | report.pdf |
          EOF
          "${{ matrix.binary }}" build build/ci-smoke/content.md --out build/ci-smoke/out > build/ci-smoke/stdout.json
          # 只把结构化 JSON 结果带进日志；冒烟断言：ok、契约版本、摘要一致、产物一致
          python - <<'PY'
          import hashlib, json, sys
          payload = json.load(open("build/ci-smoke/stdout.json", encoding="utf-8"))
          expected = hashlib.sha256(open("build/ci-smoke/content.md", "rb").read()).hexdigest()
          assert payload["ok"] is True, "smoke build not ok"
          assert payload["input_sha256"] == expected, "input_sha256 mismatch"
          disk = json.load(open("build/ci-smoke/out/build-result.json", encoding="utf-8"))
          assert disk == payload, "build-result.json != stdout"
          print("smoke ok:", payload["contract_version"], payload["template_id"])
          PY
          test -s build/ci-smoke/out/report.pdf

      - name: Prepare npm platform package
        run: python scripts/prepare_npm_platform_package.py --platform "${{ matrix.platform }}" --binary "${{ matrix.binary }}"

      - name: Pack platform package
        run: npm pack --dry-run
        working-directory: ${{ matrix.package-dir }}

      - name: Publish platform package
        if: ${{ github.event.inputs.publish == 'true' }}
        shell: bash
        run: |
          package_id="$(node -p "const p=require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package_id" version >/dev/null 2>&1; then
            echo "$package_id already exists on npm; skipping publish."
          else
            npm publish
          fi
        working-directory: ${{ matrix.package-dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: Publish main npm package
    runs-on: ubuntu-latest
    needs: build-platform
    if: ${{ github.event.inputs.publish == 'true' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/reportkit-cli-core
          ssh-key: ${{ secrets.CORE_CHECKOUT_SSH_KEY }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack main package
        run: npm pack --dry-run

      - name: Publish main package
        shell: bash
        run: |
          package_id="$(node -p "const p=require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package_id" version >/dev/null 2>&1; then
            echo "$package_id already exists on npm; skipping publish."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
